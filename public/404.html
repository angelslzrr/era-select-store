<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f8f4ee" />
    <link rel="icon" type="image/png" href="/images/logo.png" />
    <title>Página no encontrada | Era Select Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f8f4ee;
        color: #2b2f33;
        font-family: "Nunito", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main { max-width: 32rem; text-align: center; }
      img { width: 96px; height: 96px; object-fit: contain; }
      h1 {
        margin: 24px 0 12px;
        font-family: "Playfair Display", Georgia, serif;
        font-size: clamp(2rem, 6vw, 2.75rem);
        line-height: 1.15;
      }
      p { margin: 0 0 32px; font-size: 1.125rem; line-height: 1.6; color: #5a6068; }
      a {
        display: inline-block;
        padding: 14px 32px;
        border-radius: 999px;
        background: #3b434b;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
        box-shadow: 0 8px 20px rgba(43, 47, 51, 0.25);
        transition: transform 200ms cubic-bezier(0.23, 1, 0.32, 1), background-color 200ms ease-out;
      }
      a:hover { background: #2b2f33; }
      a:active { transform: scale(0.97); }
      a:focus-visible { outline: 3px solid #b08a5b; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/images/logo.png" alt="Era Select Store" />
      <h1>Oops, esta página no existe</h1>
      <p>Puede que el enlace haya cambiado o que ya no esté disponible. Volvamos a lo que sí te va a gustar.</p>
      <a href="/">Volver al inicio</a>
    </main>
  </body>
</html>
